<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>토론법정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#1b2333; --ink2:#4a5468; --mute:#8a93a6; --line:#e3e6ee; --bg:#f5f6fa; --card:#fff;
  --navy:#1e2a44; --gold:#c9a24a;
  --pro:#2f6fd6; --pro-bg:#eaf1fd; --con:#d64a3a; --con-bg:#fdecea; --neu:#8a93a6; --neu-bg:#f0f1f5;
  --ok:#1f9d63; --warn:#e08a00; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--navy);color:#fff;font-weight:600}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.sm{padding:6px 10px;font-size:14px;border-radius:8px}
button.pro{background:var(--pro)} button.con{background:var(--con)} button.gold{background:var(--gold);color:#1b1b1b}
button:disabled{opacity:.45;cursor:not-allowed}
input,textarea,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:14px;color:var(--ink2);margin:12px 0 6px;font-weight:600}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.mute{color:var(--mute);font-size:14px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--neu-bg);color:var(--ink2)}
.badge.pro{background:var(--pro-bg);color:var(--pro)} .badge.con{background:var(--con-bg);color:var(--con)} .badge.gold{background:#f7efd9;color:#8a6a1c}
h1,h2,h3{margin:0 0 8px;line-height:1.3} h2{font-size:20px} h3{font-size:17px}
.top{background:var(--navy);color:#fff;padding:12px 16px}
.top .wrap{padding:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top b{font-size:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tabs button{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:500;font-size:15px}
.chip.pro{background:var(--pro);color:#fff;border-color:var(--pro)}
.chip.con{background:var(--con);color:#fff;border-color:var(--con)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.stance{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stance button{background:#fff;color:var(--ink);border:2px solid var(--line);padding:14px 4px;font-size:17px}
.stance button.on.pro{border-color:var(--pro);background:var(--pro-bg);color:var(--pro)}
.stance button.on.con{border-color:var(--con);background:var(--con-bg);color:var(--con)}
.stance button.on.neu{border-color:var(--neu);background:var(--neu-bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.two{grid-template-columns:1fr}}
.feed{display:flex;flex-direction:column;gap:6px}
.rec{padding:8px 10px;border-radius:10px;background:#fafbfd;border:1px solid var(--line);font-size:15px;white-space:pre-wrap;word-break:break-word}
.rec .who{font-size:12px;font-weight:700;color:var(--ink2);margin-right:6px}
.rec .x{float:right;background:none;color:var(--mute);padding:0 4px;font-size:14px}
.side-pro{border-top:4px solid var(--pro)} .side-con{border-top:4px solid var(--con)}
.ai{background:#fbf8ef;border:1px solid #eadbb0;border-radius:10px;padding:10px 12px;font-size:15px}
.ai ul{margin:4px 0 0;padding-left:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;z-index:99;font-size:15px;max-width:90vw}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list-item:last-child{border-bottom:0}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--ink2);font-weight:600;background:#fafbfd}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;height:34px;border-radius:8px;overflow:hidden;background:var(--neu-bg)}
.bar div{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden}
.bar .p{background:var(--pro)} .bar .n{background:var(--neu)} .bar .c{background:var(--con)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.prewrap{white-space:pre-wrap}
/* ---------- board (projector) ---------- */
.board{min-height:100vh;display:flex;flex-direction:column;background:#eef0f5}
.board .head{background:var(--navy);color:#fff;padding:14px 28px;display:flex;align-items:center;gap:20px}
.board .head .topic{font-size:28px;font-weight:800;flex:1;line-height:1.25}
.board .head .fmt{border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:3px 12px;font-size:15px;font-weight:700}
.board .stagebar{display:flex;align-items:center;gap:20px;padding:14px 28px;background:#fff;border-bottom:1px solid var(--line)}
.board .stagename{font-size:30px;font-weight:800;flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.board .timer{font-size:64px;line-height:1}
.timer.low{color:var(--warn)} .timer.over{color:var(--con);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.board .main{flex:1;padding:20px 28px;display:flex;flex-direction:column;gap:16px}
.board .col{background:#fff;border-radius:16px;padding:18px 20px;font-size:22px;min-height:200px}
.board .col h3{font-size:24px}
.board .rec{font-size:20px}
.board .ai{font-size:21px}
.board .caption{background:#11182a;color:#fff;padding:16px 28px;font-size:24px;min-height:70px;display:flex;align-items:center;gap:14px}
.board .caption .who{color:var(--gold);font-weight:800;white-space:nowrap}
.board .ctrl{background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.board .ctrl .sep{width:1px;height:28px;background:var(--line);margin:0 4px}
.big-qr{display:flex;gap:40px;align-items:center;justify-content:center;flex-wrap:wrap}
.big-qr .qrbox{background:#fff;padding:18px;border-radius:16px}
.big-num{font-size:72px;font-weight:800;line-height:1}
.qitem{padding:12px 16px;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:21px;cursor:default}
.qitem.click{cursor:pointer} .qitem.on{border-color:var(--gold);background:#fbf8ef}
.verdict{font-size:20px;white-space:pre-wrap;line-height:1.65}
@media print{.noprint{display:none!important} body{background:#fff}}
</style>
</head>

const STAGES = [

/* ================= Gemini ================= */
async function gemini(prompt, json = true) {
  const key = LS.get('gemini_key');
  if (!key) throw new Error('관리 화면 → 설정에서 Gemini API 키를 먼저 입력하세요.');
  const main = LS.get('gemini_model') || 'gemini-3.8-flash';
  // 서버 혼잡(503)·한도(429) 시 재시도 후 예비 모델로 자동 전환
  const models = [...new Set([main, 'gemini-3.6-flash', 'gemini-3.5-flash-lite'])];
  const body = {contents:[{role:'user', parts:[{text:prompt}]}], generationConfig:{temperature:0.4}};
  if (json) body.generationConfig.responseMimeType = 'application/json';
  let r, lastStatus = 0, lastText = '';
  outer: for (const model of models) {
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
          method:'POST', headers:{'Content-Type':'application/json', 'x-goog-api-key':key}, body:JSON.stringify(body)
        });
      } catch { r = null; lastStatus = 0; lastText = '네트워크 오류'; await sleep(1500); continue; }
      if (r.ok) break outer;
      lastStatus = r.status; lastText = await r.text();
      if (r.status === 400 && /API key/i.test(lastText)) throw new Error('API 키가 올바르지 않습니다.');
      if (r.status === 403) throw new Error('이 키로는 Gemini를 쓸 수 없습니다. 키를 다시 확인하세요.');
      if (r.status === 404) continue outer;            // 이 모델을 쓸 수 없음 → 다음 모델
      if (r.status === 503 || r.status === 500) { await sleep(2000 * (attempt + 1)); continue; }
      if (r.status === 429) continue outer;            // 이 모델 한도 초과 → 다음 모델
      throw new Error('AI 오류 ' + r.status + ': ' + lastText.slice(0, 160));
    }
  }
  if (!r || !r.ok) {
    if (lastStatus === 429) throw new Error('무료 사용량 한도에 걸렸습니다. 1분쯤 뒤에 다시 시도하세요.');
    if (lastStatus === 503 || lastStatus === 500) throw new Error('구글 AI 서버가 혼잡합니다. 잠시 후 다시 눌러 주세요.');
    throw new Error('AI 연결 실패 (' + (lastStatus || '네트워크') + ')');
  }
  const d = await r.json();
  const text = (d.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
  if (!json) return text.trim();
  try { return JSON.parse(text.replace(/^\s*```(json)?/i, '').replace(/```\s*$/, '')); }
  catch { throw new Error('AI 응답을 해석하지 못했습니다. 다시 시도하세요.'); }
}

  /* ----- 학번 로그인 (기기에 기억) ----- */
  renderLogin(cand) {
    app.innerHTML = `<div class="top"><div class="wrap"><b>⚖️ 토론법정</b></div></div>
    <div class="wrap"><div class="card" style="max-width:420px;margin:24px auto">
      ${cand ? `<p style="font-size:22px;text-align:center;margin:20px 0"><b>${esc(cand.no)}</b> ${esc(cand.name)} 학생이 맞나요?</p>
        <div class="row"><button class="ghost grow" onclick="Student.renderLogin()">아니요</button><button class="grow" onclick="Student.confirm()">네, 맞아요</button></div>`
      : `<h2>학번으로 시작하기</h2><p class="mute">한 번 입력하면 이 기기에서 기억합니다.</p>
        <label>학번</label><input id="no" inputmode="numeric" placeholder="예: 20301" autofocus>
        <p id="err" style="color:var(--con);min-height:22px"></p>
        <button style="width:100%" id="lbtn" onclick="Student.lookup()">확인</button>`}
      <p class="mute" style="text-align:center;margin-top:18px"><a href="#admin" onclick="setTimeout(()=>location.reload())">교사</a></p>
    </div></div>`;
    this.cand = cand;
    const inp = $('#no'); if (inp) inp.onkeydown = e => { if (e.key === 'Enter') Student.lookup(); };
  },
  async lookup() {
    const no = $('#no').value.trim(); if (!no) return;
    $('#lbtn').disabled = true;
    const cs = (await getDocs(collection(db, 'debate_classes'))).docs.map(d => ({id:d.id, ...d.data()}))
      .filter(c => nameMap(c)[no]).sort((a, b) => (b.year || 0) - (a.year || 0));
    $('#lbtn').disabled = false;
    if (!cs.length) { $('#err').textContent = '명단에 없는 학번입니다. 다시 확인하세요.'; return; }
    this.renderLogin({no, name:nameMap(cs[0])[no], classId:cs[0].id});
  },
  confirm() {
    const c = this.cand; LS.set('me', JSON.stringify({no:c.no, classId:c.classId}));
    location.reload();
  },
  async logout() {
    if (!confirm('학번을 바꿀까요? 작성한 내용은 저장되어 있습니다.')) return;
    try {
      const a = await getDoc(doc(db, 'debate_meta', 'active'));
      if (a.exists()) await deleteDoc(doc(db, 'debate_sessions', a.data().sid, 'presence', this.me));
    } catch {}
    LS.del('me'); location.href = location.pathname;
  },
  /* ----- 메인 화면: 나의 토론 ----- */
  home() {
    const nm = nameMap(this.cls)[this.me];
    let sessions = [], active = null;
    const draw = () => {
      const st = s => s.id === active ? 'live' : (s.status === 'done' ? 'done' : 'prep');
      const mine = s => roleOf(s, this.me);
      const live = sessions.find(s => st(s) === 'live');
      const prep = sessions.filter(s => st(s) === 'prep' && mine(s).side !== 'aud');
      const done = sessions.filter(s => st(s) === 'done');
      const item = (s, extra) => {
        const r = mine(s), t = T(s);
        const badge = r.side === 'pro' ? `<span class="badge pro">${esc(t.pro)}${r.clerk ? ' · 서기' : ''}</span>` : r.side === 'con' ? `<span class="badge con">${esc(t.con)}${r.clerk ? ' · 서기' : ''}</span>` : `<span class="badge gold">${esc(t.aud)}</span>`;
        return `<div class="list-item" style="cursor:pointer" onclick="location.href='?s=${s.id}'"><div class="grow"><b>${esc(s.title)}</b><div class="mute">${esc(s.date || '날짜 미정')} · ${esc(t.name)}</div></div>${badge}${extra || ''}<span style="font-size:20px">›</span></div>`;
      };
      app.innerHTML = `<div class="top"><div class="wrap"><b class="grow">⚖️ 토론법정</b><span style="font-size:14px">${esc(this.me)} ${esc(nm)}</span><button class="ghost sm" onclick="Student.logout()">학번 변경</button></div></div>
      <div class="wrap">
        ${live ? `<div class="card" style="border:2px solid var(--con);cursor:pointer" onclick="location.href='?s=${live.id}'">
            <div class="row"><span class="badge con">🔴 지금 진행 중</span><span class="mute grow">${esc(live.date || '')}</span></div>
            <h2 style="margin-top:8px">${esc(live.title)}</h2>
            <button style="width:100%;margin-top:8px">참여하기</button></div>`
          : `<div class="card mute" style="text-align:center">지금 진행 중인 토론은 없습니다.</div>`}
        <div class="card"><h3>✍️ 내가 토론자인 주제</h3><p class="mute">토론 전에 사전 보고서를 미리 작성하세요.</p>
          ${prep.map(s => { const rep = this.reps?.[s.id]; return item(s, rep ? '<span class="badge gold">보고서 ✅</span>' : '<span class="badge">보고서 미제출</span>'); }).join('') || '<p class="mute">준비 중인 토론이 없습니다.</p>'}</div>
        <div class="card"><h3>📁 지난 토론</h3>${done.map(s => item(s)).join('') || '<p class="mute">아직 없습니다.</p>'}</div>
      </div>`;
    };
    this.reps = {};
    this.unsub.push(onSnapshot(doc(db, 'debate_meta', 'active'), d => { active = d.exists() ? d.data().sid : null; draw(); }));
    this.unsub.push(onSnapshot(query(collection(db, 'debate_sessions'), where('classId', '==', this.classId)), async q => {
      sessions = q.docs.map(d => ({id:d.id, ...d.data()})).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      draw();
      await Promise.all(sessions.filter(s => roleOf(s, this.me).side !== 'aud').map(async s => {
        const r = await getDoc(doc(db, 'debate_sessions', s.id, 'reports', this.me)); this.reps[s.id] = r.exists() && !!r.data().pre;
      }));
      draw();
    }));
  },
  async openSession(sid) {
    const sd = await getDoc(sref(sid));
    if (!sd.exists()) { app.innerHTML = `<div class="wrap"><div class="card">토론을 찾을 수 없습니다. <a href="${location.pathname}">목록으로</a></div></div>`; return; }
    this.s = sd.data();
    if (this.s.classId !== this.classId) { app.innerHTML = `<div class="wrap"><div class="card">우리 반 토론이 아닙니다. <a href="${location.pathname}">목록으로</a></div></div>`; return; }
    this.sid = sid;
    const a = await getDoc(doc(db, 'debate_meta', 'active'));
    if (a.exists() && a.data().sid === sid) {
      // 진행 중인 토론에만 접속 기록. 같은 기기로 접속했던 다른 학번은 지움 → 기기 1대 = 학생 1명
      const mine = await getDocs(query(collection(db, 'debate_sessions', sid, 'presence'), where('uid', '==', USER.uid)));
      await Promise.all(mine.docs.filter(d => d.id !== this.me).map(d => deleteDoc(d.ref)));
      await setDoc(doc(db, 'debate_sessions', sid, 'presence', this.me), {name:nameMap(this.cls)[this.me], ts:Date.now(), uid:USER.uid});
    }
    this.enter();
  },
  async enter() {
    const sid = this.sid;
    const [v0, r0] = await Promise.all([getDoc(doc(db, 'debate_sessions', sid, 'votes', this.me)), getDoc(doc(db, 'debate_sessions', sid, 'reports', this.me))]);
    this.myVote = v0.exists() ? v0.data() : null; this.myReport = r0.exists() ? r0.data() : null;
    this.unsub.push(onSnapshot(sref(sid), d => {
      this.s = d.data(); this.role = roleOf(this.s, this.me);
      if (this.s.stage !== this.lastStage) { this.lastStage = this.s.stage; this.render(); }
      else this.update();
    }));
    this.unsub.push(onSnapshot(query(collection(db, 'debate_sessions', sid, 'records'), orderBy('ts')), q => {
      this.records = q.docs.map(d => ({id:d.id, ...d.data()})); this.updateFeeds();
    }));
    this.unsub.push(onSnapshot(doc(db, 'debate_sessions', sid, 'votes', this.me), d => { this.myVote = d.exists() ? d.data() : null; }));
    this.unsub.push(onSnapshot(doc(db, 'debate_sessions', sid, 'reports', this.me), d => { this.myReport = d.exists() ? d.data() : null; }));
    setInterval(() => this.tick(), 500);
  },
  roleBadge() {
    const t = T(this.s), r = this.role;
    if (r.side === 'pro') return `<span class="badge pro">${esc(t.pro)}${r.clerk ? ' · 서기' : ''}</span>`;
    if (r.side === 'con') return `<span class="badge con">${esc(t.con)}${r.clerk ? ' · 서기' : ''}</span>`;
    return `<span class="badge gold">${esc(t.aud)}</span>`;
  },
  header() {
    const nm = nameMap(this.cls)[this.me];
    return `<div class="top"><div class="wrap"><b class="grow">⚖️ ${esc(this.s.title)}</b>
      <span style="font-size:14px">${esc(this.me)} ${esc(nm)}</span>${this.roleBadge()}
      <button class="ghost sm" onclick="location.href=location.pathname">← 목록</button></div></div>`;
  },
  stageBar() {
    const st = STAGES[this.s.stage];
    const timed = st.min > 0 && this.s.timer;
    return `<div class="card row" style="margin-top:14px"><div class="grow"><div class="mute">${this.s.stage}/${STAGES.length - 1} 단계</div><h2 style="margin:0">${esc(stageName(this.s, this.s.stage))}</h2></div>
      ${timed ? `<div class="timer" id="stimer" style="font-size:34px"></div>` : ''}</div>
      <div id="caption"></div>`;
  },
  render() {
    const s = this.s, st = STAGES[s.stage], r = this.role, t = T(s);
    let body = '';
    if (st.type === 'lobby') {
      body = `<div class="card" style="text-align:center;padding:30px">
        <p class="mute">오늘의 ${esc(t.name)}</p><h2>${esc(s.title)}</h2>
        <div class="row" style="justify-content:center;margin:12px 0"><span class="badge pro">찬성: ${esc(s.proLabel || '')}</span><span class="badge con">반대: ${esc(s.conLabel || '')}</span></div>
        <p>나의 역할: ${this.roleBadge()}</p><p class="mute">선생님이 시작하면 화면이 자동으로 바뀝니다.</p></div>`;
      if (r.side !== 'aud') body += this.preReportForm(true);
    } else if (st.type === 'pre') {
      if (r.side === 'aud') {
        const v = this.myVote?.pre;
        body = `<div class="card"><h3>사전 투표</h3><p class="mute">토론을 듣기 전, 지금 나의 입장은?</p>
          <div class="stance" id="stance">${['pro', 'neu', 'con'].map(k => `<button class="${k} ${v?.stance === k ? 'on' : ''}" data-k="${k}" onclick="Student.pick(this)">${STANCE[k]}</button>`).join('')}</div>
          <label>그렇게 생각하는 이유</label><textarea id="reason" placeholder="한두 문장으로 적어 주세요">${esc(v?.reason || '')}</textarea>
          <label>토론자에게 묻고 싶은 질문 (선택)</label><textarea id="question" style="min-height:60px" placeholder="예: 찬성 측은 ○○ 문제를 어떻게 해결할 수 있나요?"></textarea>
          <p class="mute">질문은 제출할 때마다 따로 쌓입니다. ${v ? '· 투표 완료 (다시 제출하면 수정됩니다)' : ''}</p>
          <button style="width:100%" onclick="Student.submitPre()">제출</button></div>`;
      } else {
        body = this.preReportForm(false);
      }
    } else if (st.type === 'debate') {
      body = '';
      if (r.clerk) {
        const members = (s[r.side] || []);
        const nm = nameMap(this.cls);
        const cur = this.speaker && members.includes(this.speaker) ? this.speaker : '';
        body += `<div class="card side-${r.side}"><h3>✍️ ${r.side === 'pro' ? '찬성' : '반대'} 측 서기 기록</h3>
          <p class="mute">발언자를 누르고 내용을 빠르게 적으세요. 정확한 문장이 아니어도 괜찮아요.</p>
          <div class="chips" id="spk">${members.map(no => `<button class="chip ${cur === no ? 'on' : ''}" onclick="Student.setSpk('${no}')">${esc(nm[no])}</button>`).join('')}</div>
          <textarea id="recText" style="margin-top:10px;min-height:80px" placeholder="예: 16세도 납세 의무가 있으니 선거권도 있어야 한다"></textarea>
          <button style="width:100%;margin-top:8px" onclick="Student.addRec()">기록 올리기</button></div>`;
      }
      if (st.key === 'audience' && r.side === 'aud') {
        body += `<div class="card"><h3>질문 보내기</h3><textarea id="question" style="min-height:60px"></textarea><button style="width:100%;margin-top:8px" onclick="Student.sendQ()">보내기</button></div>`;
      }
      body += `<div id="feeds"></div>`;
    } else if (st.type === 'post') {
      if (r.side === 'aud') {
        const pv = this.myVote?.pre, v = this.myVote?.post;
        body = `<div class="card"><h3>사후 투표</h3>
          <div class="card" style="background:#fafbfd">
            <div class="mute">사전 투표 때 나의 입장</div>
            ${pv ? `<p style="margin:4px 0"><span class="badge ${pv.stance === 'neu' ? '' : pv.stance}">${STANCE[pv.stance]}</span> ${esc(pv.reason)}</p>` : '<p class="mute">사전 투표 기록이 없습니다.</p>'}
          </div>
          <p class="mute">토론을 들은 지금, 나의 입장은?</p>
          <div class="stance" id="stance">${['pro', 'neu', 'con'].map(k => `<button class="${k} ${v?.stance === k ? 'on' : ''}" data-k="${k}" onclick="Student.pick(this)">${STANCE[k]}</button>`).join('')}</div>
          <label>그렇게 생각하는 이유</label><textarea id="reason">${esc(v?.reason || '')}</textarea>
          <label>입장이 바뀌었다면 (또는 더 굳어졌다면) 무엇 때문인가요?</label><textarea id="change" style="min-height:60px">${esc(v?.changeReason || '')}</textarea>
          <label>가장 설득력 있었던 발언·논거</label><input id="best" value="${esc(v?.best || '')}">
          <button style="width:100%;margin-top:12px" onclick="Student.submitPost()">제출</button>${v ? '<p class="mute">투표 완료 · 다시 제출하면 수정됩니다</p>' : ''}</div>`;
      } else {
        body = `<div class="card" style="text-align:center;padding:30px"><h3>${esc(t.aud)} 투표 중입니다</h3><p class="mute">토론자는 투표하지 않습니다. 잠시 기다려 주세요.</p></div><div id="feeds"></div>`;
      }
    } else if (st.type === 'result') {
      body = `<div id="verdictBox"></div>` + (r.side !== 'aud' ? this.postReportForm() : `
        <div class="card"><h3>${esc(t.aud)} 소감</h3><p class="mute">토론을 듣고 새롭게 알게 된 점, 생각의 변화, 양측 논증의 강점과 아쉬운 점을 정리하세요.</p>
          <textarea id="postReport" style="min-height:160px">${esc(this.myReport?.post || '')}</textarea>
          <label>한 줄 느낀점</label><input id="reflection" value="${esc(this.myReport?.reflection || '')}">
          <button style="width:100%;margin-top:10px" onclick="Student.savePost()">저장</button></div>`);
    }
    app.innerHTML = this.header() + `<div class="wrap">${this.stageBar()}${body}</div>`;
    this.update(); this.updateFeeds();
    const ta = $('#recText'); if (ta) ta.onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) Student.addRec(); };
  },
  preReportForm(early) {
    const rp = this.myReport || {}, done = !!rp.pre;
    const side = this.role.side === 'pro' ? '찬성' : '반대';
    return `<div class="card side-${this.role.side}"><div class="row"><h3 class="grow">찬반 토론 보고서 · 1차: 토론 준비 및 전략 탐색</h3>${done ? '<span class="badge gold">제출 완료 ✅</span>' : '<span class="badge">미제출</span>'}</div>
      <p class="mute">주제: ${esc(this.s.title)} · <b>${side}</b> · 학번·이름·날짜는 자동으로 기록됩니다.<br>
      ${early ? '토론 전까지 미리 작성하세요. 같은 진영 친구와 의논은 해도 되지만 <b>보고서는 각자 자기 말로</b> 씁니다. 저장 후에도 언제든 고칠 수 있어요.'
              : (done ? '미리 제출한 보고서입니다. 토론 전에 한 번 더 읽어 보세요.' : '아직 제출하지 않았어요.')}</p>
      ${reportFormHTML(REPORT1, rp.r1, 'r1')}
      <div class="row" style="margin-top:14px"><button class="ghost grow" onclick="Student.saveR1(true)">임시 저장</button><button class="grow" onclick="Student.saveR1(false)">${done ? '수정 제출' : '제출'}</button></div></div>`;
  },
  async saveR1(draft) {
    const {d, missing} = readForm(REPORT1, 'r1');
    if (!draft && missing) return toast(`'${missing}' 항목을 작성하세요`);
    const data = {r1:d, r1Ts:Date.now()};
    if (!draft) data.pre = reportText(REPORT1, d);
    await setDoc(doc(db, 'debate_sessions', this.sid, 'reports', this.me), data, {merge:true});
    this.myReport = {...(this.myReport || {}), ...data};
    toast(draft ? '임시 저장했습니다 (아직 제출 전)' : '제출했습니다 ✅'); if (!draft) this.render();
  },
  postReportForm() {
    const rp = this.myReport || {}, done = !!rp.post;
    const d = {...(rp.r2 || {})};
    if (!d.role && rp.r1?.role) d.role = rp.r1.role;            // 1차 내용을 처음 값으로 채움
    if (!d.contrib && rp.r1?.contrib) d.contrib = rp.r1.contrib;
    return `<div class="card side-${this.role.side}"><div class="row"><h3 class="grow">찬반 토론 보고서 · 2차: 토론 마무리 입장 정리</h3>${done ? '<span class="badge gold">제출 완료 ✅</span>' : '<span class="badge">미제출</span>'}</div>
      <p class="mute">역할과 기여 부분은 1차 보고서 내용으로 미리 채워 두었어요. 실제 토론에서 한 일에 맞게 고치세요.</p>
      ${reportFormHTML(REPORT2, d, 'r2')}
      <label>한 줄 느낀점</label><input id="reflection" value="${esc(rp.reflection || '')}">
      <div class="row" style="margin-top:14px"><button class="ghost grow" onclick="Student.saveR2(true)">임시 저장</button><button class="grow" onclick="Student.saveR2(false)">${done ? '수정 제출' : '제출'}</button></div></div>`;
  },
  async saveR2(draft) {
    const {d, missing} = readForm(REPORT2, 'r2');
    if (!draft && missing) return toast(`'${missing}' 항목을 작성하세요`);
    const data = {r2:d, r2Ts:Date.now(), reflection:$('#reflection').value.trim()};
    if (!draft) { data.post = reportText(REPORT2, d); data.postTs = Date.now(); }
    await setDoc(doc(db, 'debate_sessions', this.sid, 'reports', this.me), data, {merge:true});
    this.myReport = {...(this.myReport || {}), ...data};
    toast(draft ? '임시 저장했습니다 (아직 제출 전)' : '제출했습니다 ✅'); if (!draft) this.render();
  },
  update() {
    const c = $('#caption');
    if (c) c.innerHTML = this.s.speech?.text ? `<div class="ai" style="margin-bottom:14px"><b>${esc(T(this.s).mc)}</b> ${esc(this.s.speech.text)}</div>` : '';
    const vb = $('#verdictBox');
    if (vb) vb.innerHTML = this.s.verdict ? `<div class="card"><h3>${esc(T(this.s).doc)}</h3><p><b>${esc(this.s.verdict.winnerText || '')}</b></p>${this.s.verdict.statsHTML || ''}<div class="prewrap" style="margin-top:12px">${esc(this.s.verdict.full)}</div></div>` : `<div class="card mute">${esc(T(this.s).doc)}을 기다리는 중입니다…</div>`;
    this.updateFeeds();
  },
  tick() {
    const el = $('#stimer'); if (!el || !this.s) return;
    const r = timerRemain(this.s); el.textContent = fmtTime(r);
    el.className = 'timer' + (r < 0 ? ' over' : r < 30 ? ' low' : '');
  },
  updateFeeds() {
    const box = $('#feeds'); if (!box || !this.s) return;
    const s = this.s, t = T(s), nm = nameMap(this.cls), r = this.role;
    const col = side => {
      const recs = this.records.filter(x => x.side === side);
      const byStage = STAGES.filter(x => x.type === 'debate').map(x => {
        const rs = recs.filter(y => y.stage === x.key); const a = s.ai?.[x.key];
        if (!rs.length && !a) return '';
        return `<div style="margin-bottom:10px"><div class="mute" style="font-weight:700">${esc(stageName(s, STAGES.indexOf(x)))}</div>

  pick(btn) { document.querySelectorAll('#stance button').forEach(b => b.classList.toggle('on', b === btn)); },

/* =====================================================================
   진행 화면 (프로젝터) + 교사 컨트롤
   ===================================================================== */
const Board = {
  sid:null, s:null, cls:null, records:[], votes:[], questions:[], presence:[], lastStage:-1, lastSpeechTs:null, busy:false, beeped:false,
  async start() {
    this.sid = params.get('s');
    if (!this.sid) { const a = await getDoc(doc(db, 'debate_meta', 'active')); this.sid = a.exists() ? a.data().sid : null; }
    if (!this.sid) { app.innerHTML = '<div class="wrap"><div class="card">진행할 토론이 없습니다. 관리 화면에서 회차를 만드세요.</div></div>'; return; }
    const sd = await getDoc(sref(this.sid)); this.s = sd.data();
    const cd = await getDoc(doc(db, 'debate_classes', this.s.classId)); this.cls = cd.data() || {students:[]};
    const sid = this.sid;
    onSnapshot(sref(sid), d => {
      this.s = d.data();
      if (this.lastSpeechTs === null) this.lastSpeechTs = this.s.speech?.ts || 0;
      else if ((this.s.speech?.ts || 0) > this.lastSpeechTs) { this.lastSpeechTs = this.s.speech.ts; TTS.speak(this.s.speech.text); }
      if (this.s.stage !== this.lastStage) { this.lastStage = this.s.stage; this.beeped = false; this.render(); } else this.update();
    });
    onSnapshot(query(collection(db, 'debate_sessions', sid, 'records'), orderBy('ts')), q => { this.records = q.docs.map(d => ({id:d.id, ...d.data()})); this.update(); });
    onSnapshot(collection(db, 'debate_sessions', sid, 'votes'), q => { this.votes = q.docs.map(d => ({no:d.id, ...d.data()})); this.update(); });
    onSnapshot(collection(db, 'debate_sessions', sid, 'questions'), q => { this.questions = q.docs.map(d => ({id:d.id, ...d.data()})).sort((a, b) => a.ts - b.ts); this.update(); });
    onSnapshot(collection(db, 'debate_sessions', sid, 'reports'), q => { this.reports = Object.fromEntries(q.docs.map(d => [d.id, d.data()])); this.update(); });
    onSnapshot(collection(db, 'debate_sessions', sid, 'presence'), q => { this.presence = q.docs.map(d => ({no:d.id, ...d.data()})); this.update(); });
    setInterval(() => this.tick(), 250);
  },
  render() {
    const s = this.s, t = T(s);
    app.innerHTML = `<div class="board">
      <div class="head"><span class="fmt">${esc(t.name)}</span><div class="topic">${esc(s.title)}</div>${s.date ? `<span style="opacity:.7">${esc(s.date)}</span>` : ''}
        <button class="ghost sm noprint" onclick="Board.fullscreen()" title="전체 화면">⛶</button>
        ${IS_TEACHER ? `<button class="ghost sm noprint" onclick="Board.exit()">✕ 관리 화면</button>` : ''}</div>
      <div class="stagebar"><div class="stagename">${esc(stageName(s, s.stage))}</div><div class="timer" id="btimer"></div></div>
      <div class="main" id="bmain"></div>
      <div class="caption"><span class="who">${esc(t.mc)}</span><span id="bcap" class="grow"></span></div>
      ${IS_TEACHER ? this.ctrlHTML() : ''}
    </div>`;
    this.update();
  },
  ctrlHTML() {
    const st = STAGES[this.s.stage];
    return `<div class="ctrl noprint">
      <button class="ghost sm" onclick="Board.go(-1)">◀ 이전</button>
      <button class="sm" onclick="Board.go(1)" ${this.s.stage >= STAGES.length - 1 ? 'disabled' : ''}>다음 단계 ▶</button>
      <span class="sep"></span>
      ${st.min > 0 ? `<button class="ghost sm" id="tbtn" onclick="Board.timerToggle()">${this.s.timer?.running ? '⏸ 일시정지' : '▶ 타이머 시작'}</button>
      <button class="ghost sm" onclick="Board.timerAdd(60)">+1분</button><button class="ghost sm" onclick="Board.timerAdd(-60)">-1분</button><button class="ghost sm" onclick="Board.timerReset()">↺</button><span class="sep"></span>` : ''}
      ${st.type === 'debate' ? `<button class="gold sm" id="aibtn" onclick="Board.aiStage()">🤖 이 단계 AI 정리</button>` : ''}
      ${st.type === 'result' || st.type === 'post' ? `<button class="gold sm" id="vbtn" onclick="Board.makeVerdict()">🤖 ${esc(T(this.s).doc)} 생성</button>` : ''}
      <span class="sep"></span>
      <button class="ghost sm" onclick="Board.replay()">🔊 다시 읽기</button>
      <button class="ghost sm" id="vtoggle" onclick="Board.voiceToggle()">${TTS.on() ? '🔈 음성 끄기' : '🔇 음성 켜기'}</button>
      <span class="grow"></span>
      <span class="mute" style="font-size:13px">진행 상태는 저장되어 있어 나갔다 와도 이어집니다</span>
    </div>`;
  },
  update() {
    const main = $('#bmain'); if (!main) return;
    const s = this.s, st = STAGES[s.stage], t = T(s), nm = nameMap(this.cls);
    $('#bcap').textContent = s.speech?.text || '';
    const tb = $('#tbtn'); if (tb) tb.textContent = s.timer?.running ? '⏸ 일시정지' : '▶ 타이머 시작';
    const aud = (this.cls.students || []).filter(x => roleOf(s, x.no).side === 'aud');
    if (st.type === 'lobby') {
      main.innerHTML = `<div class="big-qr" style="flex:1"><div class="qrbox" id="qr"></div>
        <div><div class="mute" style="font-size:20px">QR코드로 접속 후 학번 입력</div><div class="big-num">${this.presence.length}<span style="font-size:28px"> / ${(this.cls.students || []).length}명 접속</span></div>
        <div class="mute" style="font-size:18px">토론자 사전 보고서 ${this.reportCount()} / ${(s.pro || []).length + (s.con || []).length}명 제출</div>
        <div class="row" style="margin-top:20px;font-size:20px"><span class="badge pro" style="font-size:18px">찬성: ${esc(s.proLabel || '')}</span><span class="badge con" style="font-size:18px">반대: ${esc(s.conLabel || '')}</span></div>
        <div style="margin-top:16px;font-size:18px"><b style="color:var(--pro)">${esc(t.pro)}</b> ${(s.pro || []).map(no => esc(nm[no]) + (s.proClerk === no ? '(서기)' : '')).join(', ')}<br><b style="color:var(--con)">${esc(t.con)}</b> ${(s.con || []).map(no => esc(nm[no]) + (s.conClerk === no ? '(서기)' : '')).join(', ')}</div></div></div>`;
      this.drawQR(280);
    } else if (st.type === 'pre' || st.type === 'post') {
      const k = st.type, done = this.votes.filter(v => v[k] && roleOf(s, v.no).side === 'aud').length;
      main.innerHTML = `<div class="big-qr" style="flex:1"><div class="qrbox" id="qr"></div><div>
        <div class="mute" style="font-size:22px">${esc(t.aud)} ${st.type === 'pre' ? '사전' : '사후'} 투표 참여</div>
        <div class="big-num">${done}<span style="font-size:30px"> / ${aud.length}명</span></div>
        ${st.type === 'pre' ? `<div class="mute" style="font-size:20px;margin-top:10px">사전 질문 ${this.questions.length}개 접수 · 토론자 사전 보고서 ${this.reportCount()} / ${(s.pro || []).length + (s.con || []).length}명 제출</div>` : ''}
        <div class="mute" style="font-size:18px;margin-top:14px">결과는 사후 투표가 끝난 뒤 공개됩니다.</div></div></div>`;
      this.drawQR(220);
    } else if (st.type === 'debate') {
      const a = s.ai?.[st.key];
      const col = side => {
        const rs = this.records.filter(x => x.side === side && x.stage === st.key).slice(-7);
        const inner = a ? `<div class="ai"><b>AI 정리</b><ul>${(a[side] || []).map(p => `<li>${esc(p)}</li>`).join('') || '<li>-</li>'}</ul></div>`
          : (rs.length ? `<div class="feed">${rs.map(y => `<div class="rec"><span class="who">${esc(nm[y.speaker] || '')}</span>${esc(y.text)}</div>`).join('')}</div>` : `<p class="mute">서기 기록을 기다리는 중…</p>`);
        return `<div class="col side-${side}"><h3 style="color:var(--${side})">${esc(side === 'pro' ? t.pro : t.con)}</h3>${inner}</div>`;
      };
      let qhtml = '';
      if (st.key === 'audience') {
        qhtml = `<div class="col"><h3>${esc(t.aud)} 질문 ${IS_TEACHER ? '<span class="mute" style="font-size:16px">눌러서 선정·낭독</span>' : ''}</h3><div class="feed">${
          this.questions.map(q => `<div class="qitem ${IS_TEACHER ? 'click' : ''} ${s.spotQ === q.id ? 'on' : ''}" ${IS_TEACHER ? `onclick="Board.spot('${q.id}')"` : ''}>${esc(q.text)} <span class="mute" style="font-size:15px">- ${esc(nm[q.no] || '')}</span></div>`).join('') || '<p class="mute">질문이 없습니다.</p>'}</div></div>`;
      }
      main.innerHTML = qhtml + `<div class="two" style="grid-template-columns:1fr 1fr">${col('pro')}${col('con')}</div>`;
    } else if (st.type === 'result') {
      const stt = voteStats(s, this.votes, this.cls);
      main.innerHTML = `<div class="two" style="grid-template-columns:1fr 1.6fr">
        <div class="col"><h3>투표 결과</h3>${barsHTML(stt)}<p style="font-size:22px;margin-top:16px"><b>${esc(winnerText(s, stt))}</b></p>
          <div class="mute" style="font-size:17px">${Object.entries(stt.moves).map(([k, v]) => `${k}: ${v}명`).join('<br>') || '입장 이동 없음'}</div></div>
        <div class="col"><h3>${esc(t.doc)}</h3>${s.verdict ? `<div class="verdict">${esc(s.verdict.full)}</div>` : `<p class="mute">${IS_TEACHER ? `아래 [${esc(t.doc)} 생성]을 누르세요.` : '작성 중…'}</p>`}</div></div>`;
    }
  },
  reportCount() { return Object.values(this.reports || {}).filter(r => r.pre).length; },
  exit() { TTS.stop(); location.href = location.pathname + '#admin'; setTimeout(() => location.reload(), 50); },
  fullscreen() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); },
  drawQR(size) {
    const el = $('#qr'); if (!el || !window.QRCode) return;
    el.innerHTML = ''; new QRCode(el, {text:studentUrl(this.sid), width:size, height:size});
  },
  tick() {
    const el = $('#btimer'); if (!el || !this.s) return;
    const st = STAGES[this.s.stage];
    if (!st.min) { el.textContent = ''; return; }
    const r = timerRemain(this.s);
    el.textContent = fmtTime(r);
    el.className = 'timer' + (r < 0 ? ' over' : r < 30 ? ' low' : '');
    if (r <= 0 && this.s.timer?.running && !this.beeped) { this.beeped = true; this.beep(); }
  },
  beep() {
    try { const c = new AudioContext(); [0, .35, .7].forEach(d => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; o.connect(g); g.connect(c.destination); g.gain.value = .15; o.start(c.currentTime + d); o.stop(c.currentTime + d + .2); }); } catch {}
  },
  async go(dir) {
    const i = Math.max(0, Math.min(STAGES.length - 1, this.s.stage + dir));
    const st = STAGES[i], sec = st.min * 60, run = st.type === 'debate';
    TTS.stop();
    await updateDoc(sref(this.sid), {stage:i, timer:{running:run, endsAt:run ? Date.now() + sec * 1000 : null, remaining:sec}, speech:{text:script(this.s, i), ts:Date.now()}, spotQ:null});
  },
  async timerToggle() {
    const t = this.s.timer || {}, r = timerRemain(this.s);
    await updateDoc(sref(this.sid), {timer: t.running ? {running:false, endsAt:null, remaining:r} : {running:true, endsAt:Date.now() + r * 1000, remaining:r}});
  },
  async timerAdd(d) {
    const t = this.s.timer || {}, r = timerRemain(this.s) + d; this.beeped = false;
    await updateDoc(sref(this.sid), {timer: t.running ? {running:true, endsAt:Date.now() + r * 1000, remaining:r} : {running:false, endsAt:null, remaining:r}});
  },
  async timerReset() { const sec = STAGES[this.s.stage].min * 60; this.beeped = false; await updateDoc(sref(this.sid), {timer:{running:false, endsAt:null, remaining:sec}}); },
  async replay() { if (this.s.speech?.text) await updateDoc(sref(this.sid), {speech:{text:this.s.speech.text, ts:Date.now()}}); },
  voiceToggle() { LS.set('voice', TTS.on() ? '0' : '1'); if (!TTS.on()) TTS.stop(); else TTS.speak('음성을 켰습니다.'); $('#vtoggle').textContent = TTS.on() ? '🔈 음성 끄기' : '🔇 음성 켜기'; },
  async spot(qid) {
    const q = this.questions.find(x => x.id === qid); if (!q) return;
    await updateDoc(sref(this.sid), {spotQ:qid, speech:{text:`${T(this.s).aud} 질문입니다. ${q.text}`, ts:Date.now()}});
  },
  async aiStage() {
    if (this.busy) return; this.busy = true;
    const btn = $('#aibtn'); if (btn) { btn.disabled = true; btn.textContent = '🤖 정리 중…'; }
    try {
      const idx = this.s.stage, st = STAGES[idx];
      const recs = this.records.filter(x => x.stage === st.key);
      if (!recs.length) throw new Error('이 단계의 서기 기록이 없습니다.');
      const out = await gemini(stagePrompt(this.s, idx, recs));
      await updateDoc(sref(this.sid), {[`ai.${st.key}`]:{pro:out.pro || [], con:out.con || [], judge:out.judge || '', ts:Date.now()}, speech:{text:out.judge || '', ts:Date.now()}});
    } catch (e) { toast(e.message, 5000); }
    this.busy = false; if (btn) { btn.disabled = false; btn.textContent = '🤖 이 단계 AI 정리'; }
  },
  async makeVerdict() {
    if (this.busy) return; this.busy = true;
    const btn = $('#vbtn'); if (btn) { btn.disabled = true; btn.textContent = '🤖 작성 중…'; }
    try {
      const bundle = await loadSessionBundle(this.sid);
      const stt = voteStats(this.s, bundle.votes, this.cls);
      if (!stt.paired) throw new Error('사전·사후 모두 투표한 학생이 없습니다.');
      const out = await gemini(verdictPrompt(this.s, bundle, stt));
      const wt = winnerText(this.s, stt);
      const upd = {verdict:{full:out.full || '', short:out.short || '', winner:stt.winner, winnerText:wt, stats:stt, statsHTML:barsHTML(stt), ts:Date.now()}, speech:{text:(out.short || ''), ts:Date.now()}};
      if (this.s.stage !== STAGES.length - 1) { upd.stage = STAGES.length - 1; upd.timer = {running:false, endsAt:null, remaining:STAGES[STAGES.length - 1].min * 60}; }
      await updateDoc(sref(this.sid), upd);
    } catch (e) { toast(e.message, 5000); }
    this.busy = false; if (btn) { btn.disabled = false; btn.textContent = `🤖 ${T(this.s).doc} 생성`; }
  },
};
window.Board = Board;

/* =====================================================================
   관리 화면 (교사 전용)
   ===================================================================== */
const Admin = {
  tab:'sessions', classes:[], sessions:[], edit:null, recClass:null, recData:null, recSel:null,
  async start() { await this.load(); this.render(); },
  async load() {
    const [c, s, a] = await Promise.all([getDocs(collection(db, 'debate_classes')), getDocs(collection(db, 'debate_sessions')), getDoc(doc(db, 'debate_meta', 'active'))]);

    this.active = a.exists() ? a.data().sid : null;

  cls(id) { return this.classes.find(c => c.id === id); },
  setTab(t) { this.tab = t; this.edit = null; this.render(); },
  render() {
    const tabs = [['sessions', '토론 회차'], ['classes', '학급 명단'], ['results', '기록·결과'], ['record', '생기부'], ['settings', '설정']];
    app.innerHTML = `<div class="top noprint"><div class="wrap"><b class="grow">⚖️ 토론법정 · 관리</b><span style="font-size:13px;opacity:.8">${esc(USER.email || '')}</span><button class="ghost sm" onclick="teacherLogout()">로그아웃</button></div></div>
    <div class="wrap"><div class="tabs noprint">${tabs.map(([k, v]) => `<button class="${this.tab === k ? 'on' : ''}" onclick="Admin.setTab('${k}')">${v}</button>`).join('')}</div><div id="tabbody"></div></div>`;
    const body = $('#tabbody');
    if (this.tab === 'sessions') body.innerHTML = this.edit ? this.sessionForm() : this.sessionList();
    if (this.tab === 'classes') body.innerHTML = this.edit ? this.classForm() : this.classList();

    if (this.tab === 'record') this.renderRecord(body);

    if (this.tab === 'sessions' && this.edit) this.bindSessionForm();

  /* ---------- 학급 명단 ---------- */
  classList() {
    return `<div class="card"><div class="row"><h2 class="grow">학급 명단</h2><button onclick="Admin.newClass()">+ 학급 추가</button></div>
      <p class="mute">학년 초에 한 번 등록하면 모든 토론 회차에서 사용합니다.</p>
      ${this.classes.map(c => `<div class="list-item"><b>${esc(c.year)}학년도 ${esc(c.name)}</b><span class="mute grow">${(c.students || []).length}명</span>
        <button class="ghost sm" onclick="Admin.editClass('${c.id}')">수정</button><button class="ghost sm" onclick="Admin.delClass('${c.id}')">삭제</button></div>`).join('') || '<p class="mute">등록된 학급이 없습니다.</p>'}</div>`;
  },
  newClass() { this.edit = {id:null, year:new Date().getFullYear(), name:'', students:[]}; this.render(); },
  editClass(id) { this.edit = {...this.cls(id)}; this.render(); },

  bindSessionForm() {
    const e = this.edit;
    const draw = () => {
      const c = this.cls($('#sc').value) || {students:[]};
      $('#roster').innerHTML = c.students.map(x => {
        const side = e.pro.includes(x.no) ? 'pro' : e.con.includes(x.no) ? 'con' : '';
        return `<button class="chip ${side}" data-no="${x.no}">${esc(x.name)}</button>`;
      }).join('');
      $('#roster').querySelectorAll('button').forEach(b => b.onclick = () => {
        const no = b.dataset.no;
        if (e.pro.includes(no)) { e.pro = e.pro.filter(x => x !== no); e.con.push(no); }
        else if (e.con.includes(no)) { e.con = e.con.filter(x => x !== no); }
        else e.pro.push(no);
        draw();
      });
      const nm = nameMap(c);
      const opts = (arr, cur) => `<option value="">— 선택 —</option>` + arr.map(no => `<option value="${no}" ${cur === no ? 'selected' : ''}>${esc(nm[no])}</option>`).join('');
      if (!e.pro.includes(e.proClerk)) e.proClerk = ''; if (!e.con.includes(e.conClerk)) e.conClerk = '';
      $('#spc').innerHTML = opts(e.pro, e.proClerk); $('#scc').innerHTML = opts(e.con, e.conClerk);
    };
    $('#sc').onchange = () => { e.pro = []; e.con = []; draw(); };
    $('#spc').onchange = ev => e.proClerk = ev.target.value;
    $('#scc').onchange = ev => e.conClerk = ev.target.value;

  async saveSession() {
    const e = this.edit;
    const data = {classId:$('#sc').value, date:$('#sd').value, format:$('#sf').value, title:$('#st').value.trim(), proLabel:$('#spl').value.trim(), conLabel:$('#scl').value.trim(),
      pro:e.pro, con:e.con, proClerk:$('#spc').value, conClerk:$('#scc').value, references:$('#sr').value};
    if (!data.title) return toast('토론 주제를 입력하세요');
    if (!data.pro.length || !data.con.length) return toast('찬성·반대 진영을 배정하세요');
    if (!data.proClerk || !data.conClerk) return toast('양측 서기를 지정하세요');
    if (e.id) await updateDoc(sref(e.id), data);
    else {
      await addDoc(collection(db, 'debate_sessions'), {...data, status:'prep', stage:0, timer:{running:false, endsAt:null, remaining:0}, ai:{}, speech:{text:'', ts:0}, verdict:null, createdAt:Date.now()});
    }
    toast('저장했습니다'); await this.load(); this.setTab('sessions');
  },
  async delSession(id) {
    if (!confirm('이 토론 회차와 모든 기록(투표·보고서 포함)을 삭제할까요? 되돌릴 수 없습니다.')) return;
    for (const c of ['records', 'votes', 'reports', 'questions', 'presence']) {
      const q = await getDocs(collection(db, 'debate_sessions', id, c));
      await Promise.all(q.docs.map(d => deleteDoc(d.ref)));
    }
    await deleteDoc(sref(id));
    if (this.active === id) await deleteDoc(doc(db, 'debate_meta', 'active'));
    await this.load(); this.render();
  },
  async activate(id) {
    await setDoc(doc(db, 'debate_meta', 'active'), {sid:id});
    await updateDoc(sref(id), {status:'live'});
    const prev = this.sessions.find(x => x.id === this.active && x.id !== id);
    if (prev && prev.status === 'live') await updateDoc(sref(prev.id), {status:'prep'});
    await this.load(); this.render(); toast('이 토론이 학생 화면 맨 위에 "진행 중"으로 뜹니다');
  },
  async setStatus(id, st) {
    if (st === 'live') return this.activate(id);
    await updateDoc(sref(id), {status:st});
    if (this.active === id) await deleteDoc(doc(db, 'debate_meta', 'active'));
    await this.load(); this.render();
    toast(st === 'done' ? '종료: 학생 화면의 "지난 토론"으로 이동했습니다' : '준비 중: 토론자만 사전 보고서를 쓸 수 있습니다');
  },

    if (this.active !== id) await this.activate(id);
    const s = this.sessions.find(x => x.id === id);

  /* ---------- 기록·결과 ---------- */

    $('#rbody').innerHTML = `<div class="card"><div class="row noprint" style="justify-content:flex-end"><button class="ghost sm" onclick="Admin.printReports(1)">📄 1차 보고서 인쇄</button><button class="ghost sm" onclick="Admin.printReports(2)">📄 2차 보고서 인쇄</button></div><h2>${esc(s.title)}</h2><p class="mute">${esc(t.name)} · ${esc(s.date || '')} · ${esc(cls.year + ' ' + cls.name)}</p>

  printReports(n) {

  },
  /* ---------- 생기부 ---------- */
  async renderRecord(body) {

      <div id="rcbody" class="card mute">불러오는 중…</div>`;

      const sess = this.sessions.filter(s => s.classId === cid);
      const bundles = {};
      for (const s of sess) bundles[s.id] = await loadSessionBundle(s.id);
      const priv = {};
      (await getDocs(collection(db, 'debate_private'))).docs.forEach(d => { if (d.id.startsWith(cid + '_')) priv[d.id.slice(cid.length + 1)] = d.data(); });
      this.recData = {cid, sess, bundles, priv};
    }
    this.drawRecordList();
  },
  studentItems(no) {
    const {sess, bundles} = this.recData;
    return sess.map(s => {
      const b = bundles[s.id], r = roleOf(s, no), t = T(s), lines = [];
      const roleName = r.side === 'aud' ? `${t.aud}(배심원)` : `${r.side === 'pro' ? '찬성' : '반대'} 측 토론자${r.clerk ? ' 겸 서기' : ''}`;
      lines.push(`■ 토론 주제: 「${s.title}」 (${t.name}) / 역할: ${roleName}`);
      if (r.side !== 'aud') {
        const said = b.records.filter(x => x.speaker === no);
        if (said.length) lines.push('· 본인 발언(서기 기록): ' + said.map(x => `[${stageName(s, STAGES.findIndex(y => y.key === x.stage))}] ${x.text}`).join(' / '));
        if (r.clerk) lines.push(`· 서기로서 ${b.records.filter(x => x.by === no).length}건의 발언을 기록함`);
      }
      const v = b.votes.find(x => x.no === no);
      if (v?.pre) lines.push(`· 사전 입장: ${STANCE[v.pre.stance]} - ${v.pre.reason}`);
      if (v?.post) lines.push(`· 사후 입장: ${STANCE[v.post.stance]} - ${v.post.reason}${v.post.changeReason ? ' / 변화 이유: ' + v.post.changeReason : ''}${v.post.best ? ' / 설득력 있던 논거: ' + v.post.best : ''}`);
      const qs = b.questions.filter(q => q.no === no); if (qs.length) lines.push('· 제출한 질문: ' + qs.map(q => q.text).join(' / '));
      const rp = b.reports[no];
      if (rp?.pre) lines.push('· 사전 보고서: ' + rp.pre);
      if (rp?.post) lines.push('· 사후 보고서: ' + rp.post);
      if (rp?.reflection) lines.push('· 느낀점: ' + rp.reflection);
      return lines.length > 1 || r.side !== 'aud' ? lines.join('\n') : '';
    }).filter(Boolean).join('\n\n');
  },
  drawRecordList() {
    const {cid, priv} = this.recData, cls = this.cls(cid);
    $('#rcbody').className = '';
    $('#rcbody').innerHTML = cls.students.map(x => {
      const items = this.studentItems(x.no), p = priv[x.no] || {};
      return `<div class="card"><div class="row"><b class="grow">${esc(x.no)} ${esc(x.name)}</b>${p.draft ? '<span class="badge gold">초안 있음</span>' : ''}
        <button class="ghost sm" onclick="this.closest('.card').querySelector('.det').hidden^=1">활동 자료 보기</button>
        <button class="gold sm" ${items ? '' : 'disabled'} onclick="Admin.genOne('${x.no}', this)">🤖 초안 생성</button></div>
        <div class="det" hidden><pre class="prewrap mute" style="font-family:inherit;font-size:14px">${esc(items || '활동 기록 없음')}</pre></div>
        <div class="ai prewrap" id="ro_${x.no}" style="margin-top:8px" ${p.roles ? '' : 'hidden'}><b>역할별 활동 정리</b>\n${esc(p.roles || '')}</div>
        <textarea id="dr_${x.no}" style="margin-top:8px" placeholder="특기사항 초안 (직접 수정 가능)">${esc(p.draft || '')}</textarea>
        <div class="row"><span class="mute grow" id="cnt_${x.no}">${(p.draft || '').length}자</span><button class="ghost sm" onclick="Admin.saveDraft('${x.no}')">저장</button></div></div>`;
    }).join('');
    cls.students.forEach(x => { const ta = $('#dr_' + x.no); ta.oninput = () => $('#cnt_' + x.no).textContent = ta.value.length + '자'; });
  },
  async genOne(no, btn) {
    const items = this.studentItems(no); if (!items) return;
    if (btn) { btn.disabled = true; btn.textContent = '작성 중…'; }
    try {
      const out = await gemini(recordPrompt(items));
      const data = {roles:out.roles || '', draft:out.draft || '', ts:Date.now()};
      await setDoc(doc(db, 'debate_private', this.recData.cid + '_' + no), data);
      this.recData.priv[no] = data;
      const ta = $('#dr_' + no); if (ta) { ta.value = data.draft; $('#cnt_' + no).textContent = data.draft.length + '자'; }
      const ro = $('#ro_' + no); if (ro) { ro.hidden = !data.roles; ro.innerHTML = '<b>역할별 활동 정리</b>\n' + esc(data.roles); }
      if (btn) { btn.disabled = false; btn.textContent = '🤖 다시 생성'; }
    } catch (e) { toast(e.message, 5000); if (btn) { btn.disabled = false; btn.textContent = '🤖 초안 생성'; } throw e; }
  },
  async genAll() {
    const cls = this.cls(this.recData.cid), b = $('#allbtn');
    const targets = cls.students.filter(x => this.studentItems(x.no));
    if (!confirm(`${targets.length}명의 초안을 생성합니다. 이미 있는 초안은 덮어씁니다. 진행할까요?`)) return;
    b.disabled = true;
    for (let i = 0; i < targets.length; i++) {
      b.textContent = `생성 중 ${i + 1}/${targets.length}`;
      try { await this.genOne(targets[i].no); }
      catch (e) { if (/한도/.test(e.message)) { await sleep(30000); i--; continue; } }
      await sleep(5000);
    }
    b.disabled = false; b.textContent = '🤖 전체 초안 생성'; toast('전체 초안 생성 완료');
  },
  async saveDraft(no) {
    const p = this.recData.priv[no] || {};
    const data = {...p, draft:$('#dr_' + no).value, ts:Date.now()};
    await setDoc(doc(db, 'debate_private', this.recData.cid + '_' + no), data);
    this.recData.priv[no] = data; toast('저장했습니다');
  },
  /* ---------- 설정 ---------- */
  settingsHTML() {
    const voices = ('speechSynthesis' in window) ? speechSynthesis.getVoices().filter(v => v.lang?.startsWith('ko')) : [];
    return `<div class="card"><h2>AI (Gemini) 설정</h2>
      <p class="mute">키는 이 기기의 브라우저에만 저장됩니다. 진행 화면을 띄울 노트북에서 설정하세요.</p>
      <label>Gemini API 키</label><input id="gk" type="password" value="${esc(LS.get('gemini_key', ''))}" placeholder="AIza...">
      <label>모델</label><input id="gm" list="gmodels" value="${esc(LS.get('gemini_model', 'gemini-3.8-flash'))}">
      <datalist id="gmodels"><option value="gemini-3.8-flash"><option value="gemini-3.6-flash"><option value="gemini-3.5-flash-lite"></datalist>
      <p class="mute">기본값 gemini-3.8-flash. 무료 사용량 한도에 자주 걸리면 gemini-3.5-flash-lite로 바꿔 보세요.</p>
      <div class="row" style="margin-top:12px"><button onclick="Admin.saveAI()">저장</button><button class="ghost" onclick="Admin.testAI(this)">연결 테스트</button></div></div>
      <div class="card"><h2>음성 (판사 멘트)</h2>
      <label><input type="checkbox" id="von" style="width:auto" ${TTS.on() ? 'checked' : ''}> 진행 화면에서 음성으로 읽기</label>
      <label>목소리</label><select id="vname"><option value="">기본 한국어 음성</option>${voices.map(v => `<option ${LS.get('voice_name') === v.name ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select>
      <label>속도: <span id="vrv">${LS.get('voice_rate', '1')}</span></label><input type="range" id="vrate" min="0.7" max="1.4" step="0.05" value="${LS.get('voice_rate', '1')}" oninput="$('#vrv').textContent=this.value">
      <div class="row" style="margin-top:12px"><button onclick="Admin.saveVoice()">저장</button><button class="ghost" onclick="Admin.saveVoice();TTS.speak('지금부터 찬반토론을 시작하겠습니다. 찬성 측의 입장 발표를 들어 보겠습니다.')">들어보기</button></div></div>`;
  },
  saveAI() { LS.set('gemini_key', $('#gk').value.trim()); LS.set('gemini_model', $('#gm').value.trim() || 'gemini-3.8-flash'); toast('저장했습니다'); },
  async testAI(btn) {
    this.saveAI(); btn.disabled = true; btn.textContent = '테스트 중…';
    try { const r = await gemini('"연결 성공"이라고만 답하라.', false); toast('✅ ' + r.slice(0, 40)); } catch (e) { toast('❌ ' + e.message, 6000); }
    btn.disabled = false; btn.textContent = '연결 테스트';
  },
  saveVoice() { LS.set('voice', $('#von').checked ? '1' : '0'); LS.set('voice_name', $('#vname').value); LS.set('voice_rate', $('#vrate').value); toast('저장했습니다'); },
};
window.Admin = Admin;
window.TTS = TTS;
window.$ = $;
</script>
</body>
</html>
